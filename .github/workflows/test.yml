name: Toolkit validation
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dialog for pseudo-terminal test
        run: |
          sudo apt-get update
          sudo apt-get install -y dialog
      - name: Shell and Python syntax
        run: |
          bash -n benchmark lib/*.sh tui/*.sh packaging/*.sh tests/*.sh
          python3 -m compileall -q reporting validation tests
      - name: Unified Full validation (unit and acceptance once)
        run: python3 -m validation.suites full --output validation-results/ci
      - name: Diagnose failing unit suite (failure only)
        if: failure()
        run: python3 -m unittest discover -s tests -v
      - name: Upload unified validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-validation-report
          path: validation-results/ci/
          if-no-files-found: warn
