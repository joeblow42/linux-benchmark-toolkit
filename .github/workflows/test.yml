name: Toolkit validation
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dialog for pseudo-terminal test
        run: |
          sudo apt-get update
          sudo apt-get install -y dialog
      - name: Shell and Python syntax
        run: |
          bash -n benchmark lib/*.sh tui/*.sh packaging/*.sh tests/*.sh
          python3 -m compileall -q reporting validation tests lbt_g5
      - name: G5-01 initial catalog contract tests
        run: python3 -m unittest discover -s tests -p 'test_g5_catalog.py' -v
      - name: G5-02 source safety and evidence contract tests
        run: python3 -m unittest discover -s tests -p 'test_g5_safety_evidence.py' -v
      - name: G5-02 bounded runtime and command fixture tests
        run: python3 -m unittest discover -s tests -p 'test_g5_runtime.py' -v
      - name: G5-02 passive, local-only and receipt completion tests
        run: python3 -m unittest discover -s tests -p 'test_g5_completion*.py' -v
      - name: G5-03 single IC-02 orchestrator contract tests
        run: python3 -m unittest discover -s tests -p 'test_g5_engine.py' -v
      - name: G5-03 bounded source wall deadline regression
        run: python3 -m unittest discover -s tests -p 'test_g5_additional_budget.py' -v
      - name: G5-03 session-scoped privilege protocol security tests
        run: python3 -m unittest discover -s tests -p 'test_g5_privilege_contract.py' -v
      - name: G5-03 standalone root helper and sudo client fixtures (no sudo)
        run: python3 -m unittest discover -s tests -p 'test_g5_root_helper.py' -v
      - name: G5-03 privileged SRC-13 original-evidence integration
        run: python3 -m unittest discover -s tests -p 'test_g5_privilege_integration.py' -v
      - name: G5-03 TUI single-session privileged helper and consent tests
        run: python3 -m unittest discover -s tests -p 'test_g5_tui_dev.py' -v
      - name: G5-04 canonical status registry and strict envelope fixtures
        run: python3 -m unittest discover -s tests -p 'test_g5_canonical_contract.py' -v
      - name: G5-04 private canonical session persistence and integrity fixtures
        run: python3 -m unittest discover -s tests -p 'test_g5_canonical_session.py' -v
      - name: G5-04 real Linux IC-02 to private canonical smoke
        run: python3 -m unittest discover -s tests -p 'test_g5_canonical_host_integration.py' -v
      - name: G5-04 CP-02 independent requirement trace and accepted-contract oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp02_trace_contract.py' -v
      - name: G5-04 CP-02 expanded requirement trace provenance fixtures
        run: python3 -m unittest discover -s tests -p 'test_g5_cp02_trace_expansion.py' -v
      - name: G5-04 CP-03 typed normalization and status-source attribution fixtures
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_normalization.py' -v
      - name: G5-04 CP-03 incremental platform EFI and tool parser contracts
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_platform_02.py' -v
      - name: G5-04 CP-03 CPU and optical capabilities normalization fixtures
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_cpu_optical_03.py' -v
      - name: G5-04 CP-03 SRC-04 DMI provenance and adversarial path oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_sysfs_paths_04.py' -v
      - name: G5-04 CP-03 SRC-07 CPU sysfs provenance and source-first negative oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_cpu_sysfs_paths_05.py' -v
      - name: G5-04 CP-03 SRC-12 block sysfs path provenance and negative oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_block_sysfs_paths_06.py' -v
      - name: G5-04 CP-03 SRC-17 optical sysfs provenance and absence oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_optical_sysfs_paths_07.py' -v
      - name: G5-04 CP-03 SRC-19 DRM PCI sysfs provenance and negative oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_drm_sysfs_paths_08.py' -v
      - name: G5-04 CP-03 SRC-22 local network link sysfs provenance and negative oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_net_sysfs_paths_09.py' -v
      - name: G5-04 CP-03 SRC-24 thermal zone source-provenance and millidegree negative oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_thermal_sysfs_paths_10.py' -v
      - name: G5-04 CP-03 SRC-25 hwmon sysfs provenance and unclassified-unit oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_hwmon_sysfs_paths_11.py' -v
      - name: G5-04 CP-03 SRC-26 power-supply path provenance and private-data oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_power_sysfs_paths_12.py' -v
      - name: G5-04 CP-03 SRC-05 lscpu stdout and diagnostic provenance oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_lscpu_stream_13.py' -v
      - name: G5-04 CP-03 owner-approved D1 nonzero exit source-incomplete oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_d1_nonzero_owner_14.py' -v
      - name: G5-04 CP-03 SRC-11 lsblk bounded JSON and D1 original stream oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_lsblk_stream_15.py' -v
      - name: G5-04 CP-03 O1 owner-approved consent provenance and nonzero fixtures
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_o1_provenance_16.py' -v
      - name: G5-04 CP-03 SRC-13 SMART NVMe source-first stdout and negative fixtures
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_src13_health_stream_17.py' -v
      - name: G5-04 CP-03 SRC-14 fixed proc mountinfo source-first and provenance oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_mountinfo_18.py' -v
      - name: G5-04 CP-03 SRC-15 D1 local FS_STAT fixed worker and adverse stream oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_fs_stat_19.py' -v
      - name: G5-04 CP-03 SRC-18 O1 optical original and adverse provenance oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_optical_media_20.py' -v
      - name: G5-04 CP-03 SRC-20 lspci PCI original and adverse provenance oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_lspci_pci_21.py' -v
      - name: G5-04 CP-03 SRC-21 O1 VAINFO profile and source provenance oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_vainfo_o1_22.py' -v
      - name: G5-04 CP-03 SRC-23 IP_LOCAL two-command source-first oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_ip_local_23.py' -v
      - name: G5-04 CP-03 SRC-28 offline package metadata source-first oracles
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_offline_dpkg_24.py' -v
      - name: G5-04 CP-02 39-case reconciliation and expected-failure review guards
        run: python3 -m unittest discover -s tests -p 'test_g5_cp02_reconciliation_review_25.py' -v
      - name: G5-04 CP-03 SRC-28 owner-A operational command and timing witness
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_src28_operational_provenance_26.py' -v
      - name: G5-04 CP-03 F-02 measured source timing
        run: python3 -m unittest discover -s tests -p 'test_g5_cp03_f02_timing_27.py' -v
      - name: Unified Full validation (unit and acceptance once)
        run: python3 -m validation.suites full --output validation-results/ci
      - name: Upload unified validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-validation-report
          path: |
            validation-results/ci/validation.json
            validation-results/ci/validation.csv
            validation-results/ci/validation.md
            validation-results/ci/validation.html
            validation-results/ci/validation.manifest.json
          if-no-files-found: warn
